[package]
name = "btd6-bot"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
enigo = "0.6.1"
image = "0.25.10"
imageproc = "0.27"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# `wgc` is not an xcap default. The default (GDI/PrintWindow) measured 82ms vs
# 53ms per capture here, and its CatmullRom resize softens the glyph edges
# template matching depends on.
xcap = { version = "0.9.8", features = ["wgc"] }

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
]

# Capture and image decoding are pixel loops; unoptimized they run ~16x slower,
# which makes dev-build timings actively misleading.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
